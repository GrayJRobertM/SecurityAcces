name: Build Windows desktop installer
on:
  push:
    branches: ['codex/windows-desktop', 'codex/metakampo-desktop']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements-desktop.txt
      - name: Prepare verified offline geolocation
        run: python packaging/download-geodata.py
      - name: Native local account integration
        env:
          FK_NATIVE_LOCAL_TESTS: "1"
        run: python -m unittest discover -s tests -p test_local_directory.py -k NativeLocalTests -v
      - name: Native shared session integration
        env:
          FK_NATIVE_SHARED_TESTS: "1"
        run: python -m unittest discover -s tests -p test_shared_desktop.py -k NativeSharedTests -v
      - name: Tests with offline geolocation
        run: python -m unittest discover -s tests -v
      - name: Parse every PowerShell script
        shell: powershell
        run: |
          Get-ChildItem windows\*.ps1 | ForEach-Object {
            $parseErrors=$null; $tokens=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Build application executable
        run: python -m PyInstaller --clean --noconfirm packaging/MetakampoAccess.spec
      - name: Verify frozen executable
        shell: powershell
        run: |
          python packaging/verify-manifest.py
          if ($LASTEXITCODE -ne 0) { throw 'Elevation manifest verification failed' }
          $process=Start-Process dist\MetakampoAccess\MetakampoAccess.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Frozen executable self-test failed' }
      - name: Download official offline desktop runtime
        shell: powershell
        run: |
          New-Item -ItemType Directory build-tools -Force | Out-Null
          $runtime='build-tools\MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
          $ProgressPreference='SilentlyContinue'
          & curl.exe --fail --location --retry 2 --max-time 240 'https://go.microsoft.com/fwlink/?linkid=2124701' --output $runtime
          if ($LASTEXITCODE -ne 0 -or (Get-Item $runtime).Length -lt 10000000) { throw 'Offline WebView2 runtime download failed' }
          $signature=Get-AuthenticodeSignature $runtime
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Invalid Microsoft runtime signature' }
      - name: Compile installer
        shell: powershell
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Install and test installed executable
        shell: powershell
        run: |
          $installer=Resolve-Path dist\installer\Metakampo-Access-Setup-x64.exe
          $process=Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\FreshkampoPilot','/LOG=C:\install-freshkampo.log' -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content C:\install-freshkampo.log; throw 'Installer test failed' }
          $process=Start-Process C:\FreshkampoPilot\MetakampoAccess.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installed application test failed' }
          $report=Join-Path $env:GITHUB_WORKSPACE 'dist\installer\GUI-SMOKE.txt'
          $process=Start-Process C:\FreshkampoPilot\MetakampoAccess.exe -ArgumentList '--gui-smoke-test','--gui-smoke-report', $report -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Desktop window failed to open and close within 90 seconds' }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'Native WebView2 window test failed' }
          $sharedHost=Start-Process C:\FreshkampoPilot\MetakampoAccess.exe -ArgumentList '--shared-smoke-host' -PassThru
          try {
            python packaging/wait-shared-host.py C:\FreshkampoPilot\MetakampoAccess.exe
            if ($LASTEXITCODE -ne 0) { throw 'Installed shared host failed to start' }
            $sharedReport=Join-Path $env:GITHUB_WORKSPACE 'dist\installer\SHARED-GUI-SMOKE.txt'
            $sharedClient=Start-Process C:\FreshkampoPilot\MetakampoClient.exe -ArgumentList '--gui-smoke-test','--gui-smoke-report',$sharedReport -PassThru
            if (-not $sharedClient.WaitForExit(90000)) { $sharedClient.Kill(); throw 'Shared desktop client timed out' }
            if ($sharedClient.ExitCode -ne 0 -or -not (Test-Path $sharedReport)) { throw 'Shared WebView2 client test failed' }
          } finally {
            if (-not $sharedHost.HasExited) { $sharedHost.Kill(); $sharedHost.WaitForExit() }
          }
          Get-FileHash $installer -Algorithm SHA256 | Format-List | Out-File dist\installer\SHA256.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: Metakampo-Access-Windows-x64
          path: dist/installer/*
          if-no-files-found: error
          retention-days: 14
