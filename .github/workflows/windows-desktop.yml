name: Build Windows desktop installer
on:
  push:
    branches: ['codex/windows-desktop']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements-desktop.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Parse every PowerShell script
        shell: powershell
        run: |
          Get-ChildItem windows\*.ps1 | ForEach-Object {
            $parseErrors=$null; $tokens=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Build application executable
        run: python -m PyInstaller --clean --noconfirm packaging/FreshkampoAccess.spec
      - name: Verify frozen executable
        shell: powershell
        run: |
          $process=Start-Process dist\FreshkampoAccess\FreshkampoAccess.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Frozen executable self-test failed' }
      - name: Download official offline desktop runtime
        shell: powershell
        run: |
          New-Item -ItemType Directory build-tools -Force | Out-Null
          $runtime='build-tools\MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2124701' -OutFile $runtime
          $signature=Get-AuthenticodeSignature $runtime
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Invalid Microsoft runtime signature' }
      - name: Compile installer
        shell: powershell
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Install and test installed executable
        shell: powershell
        run: |
          $installer=Resolve-Path dist\installer\Freshkampo-Access-Setup-x64.exe
          $process=Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\FreshkampoPilot','/LOG=C:\install-freshkampo.log' -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content C:\install-freshkampo.log; throw 'Installer test failed' }
          $process=Start-Process C:\FreshkampoPilot\FreshkampoAccess.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installed application test failed' }
          Get-FileHash $installer -Algorithm SHA256 | Format-List | Out-File dist\installer\SHA256.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: Freshkampo-Access-Windows-x64
          path: dist/installer/*
          if-no-files-found: error
          retention-days: 14
